<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">PredictiveEdge Market Intelligence component architecture</title>
  <desc id="desc">Canonical sources enter a deterministic Market Intelligence causal pipeline. Immutable analysis, evidence and Market Context are persisted and reliably published to read-only CORE AI consumers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475467"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0B2545}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#475467}
      .section{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#344054}.boxTitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#101828}
      .boxText{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#344054}.small{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#475467}
      .arrow{stroke:#475467;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="70" y="58" class="title">Market Intelligence - deterministic CORE AI market-understanding architecture</text>
  <text x="70" y="86" class="subtitle">Sole publisher of immutable Market Context | describes the market | never recommends, sizes or executes a trade</text>

  <rect x="50" y="120" width="250" height="700" rx="18" fill="#F7F8FA" stroke="#98A2B3" stroke-width="2"/>
  <text x="75" y="155" class="section">Canonical inputs</text>
  <g filter="url(#shadow)">
    <rect x="75" y="185" width="200" height="78" rx="10" fill="#FFFFFF" stroke="#98A2B3"/><text x="175" y="216" text-anchor="middle" class="boxTitle">Equity market facts</text><text x="175" y="242" text-anchor="middle" class="boxText">trades / L1 / depth / bars</text>
    <rect x="75" y="285" width="200" height="78" rx="10" fill="#FFFFFF" stroke="#98A2B3"/><text x="175" y="312" text-anchor="middle" class="boxTitle">Issuer + context</text><text x="175" y="336" text-anchor="middle" class="boxText">actions / financials / flows</text><text x="175" y="354" text-anchor="middle" class="small">news / macro</text>
    <rect x="75" y="385" width="200" height="78" rx="10" fill="#FFFFFF" stroke="#98A2B3"/><text x="175" y="416" text-anchor="middle" class="boxTitle">Exchange calendar</text><text x="175" y="442" text-anchor="middle" class="boxText">sessions / halts / holidays</text>
    <rect x="75" y="485" width="200" height="78" rx="10" fill="#FFFFFF" stroke="#98A2B3"/><text x="175" y="516" text-anchor="middle" class="boxTitle">Instrument master</text><text x="175" y="542" text-anchor="middle" class="boxText">identity / mappings / universe</text>
    <rect x="75" y="585" width="200" height="78" rx="10" fill="#FFFFFF" stroke="#98A2B3"/><text x="175" y="616" text-anchor="middle" class="boxTitle">EvaluationClock</text><text x="175" y="642" text-anchor="middle" class="boxText">live or deterministic virtual</text>
  </g>

  <rect x="335" y="120" width="815" height="700" rx="18" fill="#F8FBFD" stroke="#2E74B5" stroke-width="3"/>
  <text x="365" y="155" class="section">Market Intelligence bounded context</text>
  <rect x="365" y="180" width="755" height="90" rx="12" fill="#EAF2F8" stroke="#2E74B5"/>
  <text x="390" y="211" class="boxTitle">Application orchestration</text>
  <text x="390" y="238" class="boxText">Evaluate / replay / as-of query - resolves ContextKey, Trader Intent, cutoffs, versions and transaction</text>

  <text x="365" y="308" class="small">DETERMINISTIC CAUSAL DOMAIN PIPELINE</text>
  <g filter="url(#shadow)">
    <rect x="365" y="330" width="225" height="92" rx="12" fill="#DDF4FF" stroke="#0969DA" stroke-width="3"/><text x="477" y="361" text-anchor="middle" class="boxTitle">Point-in-time selector</text><text x="477" y="387" text-anchor="middle" class="boxText">latest eligible revision</text><text x="477" y="407" text-anchor="middle" class="small">IMPLEMENTED MI-0.1</text>
    <rect x="615" y="330" width="225" height="92" rx="12" fill="#DDF4FF" stroke="#0969DA" stroke-width="3"/><text x="727" y="361" text-anchor="middle" class="boxTitle">Input Manifest</text><text x="727" y="387" text-anchor="middle" class="boxText">ordered + content-addressed</text><text x="727" y="407" text-anchor="middle" class="small">IMPLEMENTED MI-0.1</text>
    <rect x="865" y="330" width="225" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="977" y="361" text-anchor="middle" class="boxTitle">Quality gates</text><text x="977" y="387" text-anchor="middle" class="boxText">block / degrade / cap</text>
    <rect x="365" y="465" width="225" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="477" y="496" text-anchor="middle" class="boxTitle">Bars + finality</text><text x="477" y="522" text-anchor="middle" class="boxText">session / revision / correction</text>
    <rect x="615" y="465" width="225" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="727" y="496" text-anchor="middle" class="boxTitle">Feature Engine</text><text x="727" y="522" text-anchor="middle" class="boxText">versioned causal definitions</text>
    <rect x="865" y="465" width="225" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="977" y="496" text-anchor="middle" class="boxTitle">Dimension evidence</text><text x="977" y="522" text-anchor="middle" class="boxText">trend / volatility / breadth</text>
    <rect x="425" y="600" width="275" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="562" y="631" text-anchor="middle" class="boxTitle">Fusion + contradiction</text><text x="562" y="657" text-anchor="middle" class="boxText">dependencies / timeframes / unknowns</text>
    <rect x="755" y="600" width="275" height="92" rx="12" fill="#E8F5EE" stroke="#238636"/><text x="892" y="631" text-anchor="middle" class="boxTitle">Confidence + Context</text><text x="892" y="657" text-anchor="middle" class="boxText">caps / materiality / immutable version</text>
  </g>
  <path d="M590 376 H615" class="arrow"/><path d="M840 376 H865" class="arrow"/>
  <path d="M977 422 V445 H477 V465" class="arrow"/><path d="M590 511 H615" class="arrow"/><path d="M840 511 H865" class="arrow"/>
  <path d="M977 557 V575 H562 V600" class="arrow"/><path d="M700 646 H755" class="arrow"/>

  <rect x="1185" y="120" width="365" height="700" rx="18" fill="#FFFBF3" stroke="#B7791F" stroke-width="2"/>
  <text x="1215" y="155" class="section">Truth, publication and consumers</text>
  <g filter="url(#shadow)">
    <rect x="1215" y="185" width="305" height="86" rx="10" fill="#FFF6E5" stroke="#B7791F"/><text x="1367" y="216" text-anchor="middle" class="boxTitle">Immutable analytical store</text><text x="1367" y="242" text-anchor="middle" class="boxText">runs / manifests / features / evidence</text>
    <rect x="1215" y="295" width="305" height="86" rx="10" fill="#FFF6E5" stroke="#B7791F"/><text x="1367" y="326" text-anchor="middle" class="boxTitle">Market Context store</text><text x="1367" y="352" text-anchor="middle" class="boxText">versions + replaceable latest projection</text>
    <rect x="1215" y="405" width="305" height="86" rx="10" fill="#FFF6E5" stroke="#B7791F"/><text x="1367" y="436" text-anchor="middle" class="boxTitle">Transactional outbox</text><text x="1367" y="462" text-anchor="middle" class="boxText">atomic with context publication</text>
    <rect x="1215" y="515" width="305" height="70" rx="10" fill="#FFF6E5" stroke="#B7791F"/><text x="1367" y="558" text-anchor="middle" class="boxTitle">Kafka event plane</text>
    <rect x="1215" y="615" width="305" height="150" rx="10" fill="#F3E8FF" stroke="#7E57C2"/><text x="1367" y="646" text-anchor="middle" class="boxTitle">Read-only CORE AI consumers</text><text x="1367" y="674" text-anchor="middle" class="boxText">Chart | Scanner | Strategy</text><text x="1367" y="700" text-anchor="middle" class="boxText">Decision | Risk | Portfolio</text><text x="1367" y="726" text-anchor="middle" class="boxText">Trade Guardian</text>
  </g>
  <path d="M1030 646 H1160 V228 H1215" class="arrow"/><path d="M1030 646 H1170 V338 H1215" class="arrow"/><path d="M1030 646 H1180 V448 H1215" class="arrow"/><path d="M1367 491 V515" class="arrow"/><path d="M1367 585 V615" class="arrow"/>
  <path d="M275 224 H320 V215 H365" class="arrow"/><path d="M275 324 H315 V225 H365" class="arrow"/><path d="M275 424 H310 V235 H365" class="arrow"/><path d="M275 524 H305 V245 H365" class="arrow"/><path d="M275 624 H320 V255 H365" class="arrow"/>

  <rect x="50" y="850" width="1500" height="82" rx="12" fill="#F2F4F7" stroke="#98A2B3"/>
  <text x="80" y="883" class="boxTitle">Non-negotiable invariant</text>
  <text x="80" y="910" class="boxText">Same ordered point-in-time observations + reference snapshots + analytical versions + configuration + EvaluationClock must reproduce the same structured output hashes.</text>
</svg>
