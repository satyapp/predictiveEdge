spring:
  application:
    name: predictiveedge-platform-core
  datasource:
    url: ${PE_DATABASE_URL:jdbc:postgresql://localhost:5432/predictiveedge}
    username: ${PE_DATABASE_USERNAME:predictiveedge}
    password: ${PE_DATABASE_PASSWORD:local-only-change-me}
  data:
    redis:
      host: ${PE_REDIS_HOST:localhost}
      port: ${PE_REDIS_PORT:6379}
      password: ${PE_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${PE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${PE_KAFKA_CLIENT_ID:predictiveedge-platform-core}
    admin:
      fail-fast: ${PE_KAFKA_ADMIN_FAIL_FAST:false}
    consumer:
      group-id: ${PE_KAFKA_CONSUMER_GROUP:predictiveedge-platform-core}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
predictiveedge:
  eventing:
    dispatch:
      enabled: ${PE_EVENTING_DISPATCH_ENABLED:false}
      batch-size: ${PE_EVENTING_DISPATCH_BATCH_SIZE:100}
      fixed-delay: ${PE_EVENTING_DISPATCH_FIXED_DELAY:PT1S}
      lease-duration: ${PE_EVENTING_DISPATCH_LEASE_DURATION:PT30S}
      retry-delay: ${PE_EVENTING_DISPATCH_RETRY_DELAY:PT10S}
      publish-timeout: ${PE_EVENTING_DISPATCH_PUBLISH_TIMEOUT:PT10S}
  kafka:
    provision-topics: ${PE_KAFKA_PROVISION_TOPICS:false}
    partitions: ${PE_KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${PE_KAFKA_TOPIC_REPLICATION_FACTOR:1}
  identity:
    otp-secret: ${PE_IDENTITY_OTP_SECRET:local-only-change-this-otp-secret-before-production}
    access-token-secret: ${PE_IDENTITY_ACCESS_TOKEN_SECRET:local-only-change-this-access-token-secret}
    otp-minutes: ${PE_IDENTITY_OTP_MINUTES:5}
    otp-max-attempts: ${PE_IDENTITY_OTP_MAX_ATTEMPTS:5}
    access-token-minutes: ${PE_IDENTITY_ACCESS_TOKEN_MINUTES:15}
    email:
      provider: ${PE_EMAIL_PROVIDER:ses}
      from-address: ${PE_SES_FROM_ADDRESS:no-reply@predictiveedge.local}
      region: ${PE_SES_REGION:ap-south-1}
    sms:
      provider: ${PE_SMS_PROVIDER:mock}
  broker:
    credential-key: ${PE_BROKER_CREDENTIAL_KEY:local-only-change-this-broker-credential-key}
    connection-state-minutes: ${PE_BROKER_CONNECTION_STATE_MINUTES:10}
    browser-lease-seconds: ${PE_BROKER_BROWSER_LEASE_SECONDS:120}
    browser-close-grace-seconds: ${PE_BROKER_BROWSER_CLOSE_GRACE_SECONDS:30}
    lease-sweep-milliseconds: ${PE_BROKER_LEASE_SWEEP_MILLISECONDS:15000}
    web-base-url: ${PE_WEB_BASE_URL:http://localhost:3000/}
    zerodha:
      api-key: ${PE_ZERODHA_API_KEY:}
      api-secret: ${PE_ZERODHA_API_SECRET:}
      stream:
        scheduler-threads: ${PE_ZERODHA_STREAM_SCHEDULER_THREADS:2}
        connect-timeout-seconds: ${PE_ZERODHA_STREAM_CONNECT_TIMEOUT_SECONDS:10}
        initial-reconnect-milliseconds: ${PE_ZERODHA_STREAM_INITIAL_RECONNECT_MILLISECONDS:500}
        maximum-reconnect-seconds: ${PE_ZERODHA_STREAM_MAXIMUM_RECONNECT_SECONDS:30}
        maximum-reconnect-attempts: ${PE_ZERODHA_STREAM_MAXIMUM_RECONNECT_ATTEMPTS:8}
        stale-after-seconds: ${PE_ZERODHA_STREAM_STALE_AFTER_SECONDS:15}
        maximum-frame-bytes: ${PE_ZERODHA_STREAM_MAXIMUM_FRAME_BYTES:2097152}
  market-intelligence:
    timeframes: ${PE_MARKET_INTELLIGENCE_TIMEFRAMES:ONE_MINUTE,FIVE_MINUTES}
    allowed-lateness: ${PE_MARKET_INTELLIGENCE_ALLOWED_LATENESS:PT2S}
    aggregation-policy-version: ${PE_MARKET_INTELLIGENCE_AGGREGATION_POLICY_VERSION:tick-ohlcv-v1}
    finality-policy-version: ${PE_MARKET_INTELLIGENCE_FINALITY_POLICY_VERSION:finality-v1}
    session-retention: ${PE_MARKET_INTELLIGENCE_SESSION_RETENTION:PT24H}
    retention-sweep-milliseconds: ${PE_MARKET_INTELLIGENCE_RETENTION_SWEEP_MILLISECONDS:60000}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
server:
  port: ${PORT:8080}
  shutdown: graceful
