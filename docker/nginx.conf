server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://platform-core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Local Ollama inference can legitimately run for several minutes.
        # Keep this above PE_OLLAMA_TIMEOUT_SECONDS (360 by default) so the
        # backend can return its structured result instead of an Nginx 504.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
