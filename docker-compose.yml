services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictiveedge}
      POSTGRES_USER: ${POSTGRES_USER:-predictiveedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictiveedge-local}
    ports:
      - "5432:5432"
    volumes:
      - predictiveedge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-predictiveedge-local}", "--appendonly", "yes"]
    volumes:
      - predictiveedge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-predictiveedge-local}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - predictiveedge-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  platform-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform-core
    environment:
      PE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-predictiveedge}
      PE_DATABASE_USERNAME: ${POSTGRES_USER:-predictiveedge}
      PE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-predictiveedge-local}
      PE_REDIS_HOST: redis
      PE_REDIS_PORT: 6379
      PE_REDIS_PASSWORD: ${REDIS_PASSWORD:-predictiveedge-local}
      PE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PE_KAFKA_CLIENT_ID: predictiveedge-platform-core
      PE_EVENTING_DISPATCH_ENABLED: ${PE_EVENTING_DISPATCH_ENABLED:-true}
      PE_KAFKA_CONSUMER_GROUP: predictiveedge-platform-core
      PE_KAFKA_PROVISION_TOPICS: "true"
      PE_KAFKA_TOPIC_PARTITIONS: ${PE_KAFKA_TOPIC_PARTITIONS:-3}
      PE_KAFKA_TOPIC_REPLICATION_FACTOR: 1
      PE_IDENTITY_OTP_SECRET: ${PE_IDENTITY_OTP_SECRET:-local-only-change-this-otp-secret-before-production}
      PE_IDENTITY_ACCESS_TOKEN_SECRET: ${PE_IDENTITY_ACCESS_TOKEN_SECRET:-local-only-change-this-access-token-secret}
      PE_EMAIL_PROVIDER: ${PE_EMAIL_PROVIDER:-ses}
      PE_SES_REGION: ${PE_SES_REGION:-ap-south-1}
      PE_SES_FROM_ADDRESS: ${PE_SES_FROM_ADDRESS:-no-reply@predictiveedge.local}
      PE_SMS_PROVIDER: ${PE_SMS_PROVIDER:-mock}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${PE_SES_REGION:-ap-south-1}
      PE_BROKER_CREDENTIAL_KEY: ${PE_BROKER_CREDENTIAL_KEY:-local-only-change-this-broker-credential-key}
      PE_BROKER_BROWSER_LEASE_SECONDS: ${PE_BROKER_BROWSER_LEASE_SECONDS:-120}
      PE_BROKER_BROWSER_CLOSE_GRACE_SECONDS: ${PE_BROKER_BROWSER_CLOSE_GRACE_SECONDS:-30}
      PE_BROKER_LEASE_SWEEP_MILLISECONDS: ${PE_BROKER_LEASE_SWEEP_MILLISECONDS:-15000}
      PE_ZERODHA_API_KEY: ${PE_ZERODHA_API_KEY:-}
      PE_ZERODHA_API_SECRET: ${PE_ZERODHA_API_SECRET:-}
      PE_WEB_BASE_URL: ${PE_WEB_BASE_URL:-http://localhost:3000/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      platform-core:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  predictiveedge-postgres-data:
  predictiveedge-redis-data:
  predictiveedge-kafka-data:
